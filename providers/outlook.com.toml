oidc = "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"

scopes = [
  "openid",
  "offline_access",
  "https://outlook.office.com/IMAP.AccessAsUser.All",
  "Mail.Send",
]

[smtp]
host = "smtp-mail.outlook.com"
port = 587
security = "STARTTLS"

[imap]
host = "outlook.office365.com"
port = 993
security = "SSL"
